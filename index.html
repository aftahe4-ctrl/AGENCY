<!-- Google Translate Scripts -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          // This line restricts the dropdown to Hindi, Bengali, English, and Portuguese
          includedLanguages: 'hi,bn,en,pt' 
        }, 'google_translate_element');
      }
    </script>
    
    <!-- The &hl=en at the very end of this link forces the menu text to stay in English -->
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit&hl=en"></script>

    <script type="module" src="/src/main.jsx"></script>
