<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/agency.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>agency</title>
    <style>
      /* 1. HIDE DEFAULT GOOGLE TRANSLATE UI */
      #google_translate_element, .skiptranslate iframe, .goog-te-banner-frame { display: none !important; }
      body { top: 0px !important; }

      /* 2. CUSTOM GOAL.COM STYLE DROPDOWN */
      .language-container {
        display: flex;
        justify-content: center;
        background: #000;
        padding: 40px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      .custom-dropdown {
        position: relative;
        width: 300px;
      }

      /* The main button */
      .dropdown-btn {
        background-color: #1a1a1a;
        color: #fff;
        padding: 12px 16px;
        font-size: 14px;
        border: 1px solid #333;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
        text-align: left;
        display: flex;
        justify-content: space-between;
      }

      /* The pop-up menu */
      .dropdown-menu {
        display: none; /* Hidden by default */
        position: absolute;
        bottom: 100%; /* Opens upward from the bottom */
        left: 0;
        width: 100%;
        background-color: #222;
        border: 1px solid #333;
        border-radius: 4px;
        margin-bottom: 5px;
        padding: 0;
        list-style: none;
        max-height: 250px;
        overflow-y: auto;
        z-index: 1000;
      }

      /* Show menu when active */
      .custom-dropdown.active .dropdown-menu {
        display: block;
      }

      /* List items styling matching the screenshot */
      .dropdown-menu li {
        padding: 12px 16px;
        color: #ccc;
        font-size: 13px;
        cursor: pointer;
        border-bottom: 1px solid #2a2a2a;
      }

      .dropdown-menu li:last-child {
        border-bottom: none;
      }

      /* The bright blue hover effect */
      .dropdown-menu li:hover {
        background-color: #007bff;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <!-- Main React App -->
    <div id="root"></div>
    
    <!-- Custom Language UI at the bottom -->
    <div class="language-container">
      <div class="custom-dropdown" id="lang-dropdown">
        <div class="dropdown-btn" onclick="toggleDropdown()">
          <span id="current-lang-text">International (English)</span>
          <span>▼</span>
        </div>
        <ul class="dropdown-menu">
          <li onclick="changeLanguage('en', 'International (English)')">International (English)</li>
          <li onclick="changeLanguage('bn', 'Bangladesh (Bengali)')">Bangladesh (Bengali)</li>
          <li onclick="changeLanguage('hi', 'India (Hindi)')">India (Hindi)</li>
          <li onclick="changeLanguage('pt', 'Brazil (Portuguese)')">Brazil (Portuguese)</li>
        </ul>
      </div>
    </div>

    <!-- Hidden Google Translate Element -->
    <div id="google_translate_element"></div>
    
    <!-- Scripts to make it work -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'hi,bn,en,pt',
          autoDisplay: false
        }, 'google_translate_element');
      }

      // Open/close the custom menu
      function toggleDropdown() {
        document.getElementById('lang-dropdown').classList.toggle('active');
      }

      // Handle language change
      function changeLanguage(langCode, langName) {
        // Update the button text
        document.getElementById('current-lang-text').innerText = langName;
        toggleDropdown(); // Close menu
        
        // Set Google Translate cookie and reload to apply translation
        document.cookie = "googtrans=/en/" + langCode + "; path=/";
        document.cookie = "googtrans=/en/" + langCode + "; path=/; domain=" + window.location.hostname;
        window.location.reload();
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
