<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/agency.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>agency</title>
    <style>
      /* 1. Hide the Google Translate top banner */
      .skiptranslate iframe { 
        display: none !important; 
      }
      body { 
        top: 0px !important; 
      }

      /* 2. Hide the actual Google Translate widget completely */
      #google_translate_element { 
        position: absolute; 
        opacity: 0; 
        z-index: -10; 
        pointer-events: none;
      }

      /* 3. Style our custom Goal.com-style dropdown */
      .custom-dropdown-container {
        text-align: center;
        padding: 40px;
        background: #000;
        display: flex;
        justify-content: center;
      }

      .custom-select {
        background-color: #2a2a2a;
        color: #e0e0e0;
        padding: 12px 20px;
        border: 1px solid #444;
        border-radius: 4px;
        font-size: 14px;
        cursor: pointer;
        outline: none;
        min-width: 260px;
      }
      
      .custom-select option {
        background-color: #2a2a2a;
        color: #fff;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <!-- Your main React application -->
    <div id="root"></div>
    
    <!-- Hidden Google Translate Widget -->
    <div id="google_translate_element"></div>

    <!-- Custom Dropdown that matches your screenshot -->
    <div class="custom-dropdown-container">
      <select id="custom-lang-selector" class="custom-select">
        <option value="en">International (English)</option>
        <option value="ar">Arabic (العربية)</option>
        <option value="es">Argentina (Español)</option>
        <option value="en">Australia (English)</option>
        <option value="bn">Bangladesh (Bengali)</option>
        <option value="pt">Brazil (Português)</option>
        <option value="en">Canada (English)</option>
        <option value="fr">France (Français)</option>
        <option value="de">Germany (Deutsch)</option>
        <option value="hi">India (Hindi)</option>
        <option value="ja">Japanese (日本語)</option>
      </select>
    </div>
    
    <!-- Google Translate Scripts -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,ar,es,bn,pt,fr,de,hi,ja'
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit&hl=en"></script>
    
    <!-- JavaScript to link your custom menu to the hidden Google tool -->
    <script>
      document.getElementById('custom-lang-selector').addEventListener('change', function() {
        var selectedLang = this.value;
        var googleCombo = document.querySelector('.goog-te-combo');
        
        if (googleCombo) {
          googleCombo.value = selectedLang;
          googleCombo.dispatchEvent(new Event('change'));
        }
      });
    </script>
    
    <!-- Vite Entry Point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
